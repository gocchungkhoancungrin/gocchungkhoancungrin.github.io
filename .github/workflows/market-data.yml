name: Cập nhật số liệu thị trường

on:
  schedule:
    # Cứ 15 phút khởi động một lần trong giờ giao dịch (09:00 đến 15:55 giờ Việt Nam), thứ Hai đến thứ Sáu
    - cron: '*/15 2-6 * * 1-5'
    - cron: '0,15,30 7 * * 1-5'
    # Các đợt bổ sung quanh giờ đóng cửa để chốt số liệu: 14:46, 14:59 và 15:05 giờ Việt Nam
    - cron: '46 7 * * 1-5'
    - cron: '59 7 * * 1-5'
    - cron: '5 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Lấy số liệu từ FPTS mỗi phút và ghi vào nhánh data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          mkdir -p work && cd work
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin data && git checkout -q -f -B data FETCH_HEAD || true
          START=$(date +%s)
          while true; do
            # Giá toàn bộ cổ phiếu (TradingView, chậm khoảng 15 phút) ghi vào live.json
            python3 - <<'PY' || echo "Lấy giá cổ phiếu lỗi, bỏ qua vòng này"
          import json, urllib.request, datetime, os
          cols = ['name','close','change','volume','open','high','low','exchange']
          body = json.dumps({'markets':['vietnam'],'symbols':{'query':{'types':['stock']}},'columns':cols,'range':[0,2000]}).encode()
          req = urllib.request.Request('https://scanner.tradingview.com/vietnam/scan', data=body, headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0'})
          rows = json.loads(urllib.request.urlopen(req, timeout=30).read().decode())['data']
          q = {}
          for row in rows:
              d = dict(zip(cols, row['d']))
              t = d['name']
              if not t or len(t) > 5 or d['close'] is None or d['exchange'] not in ('HOSE','HNX','UPCOM'):
                  continue
              q[t] = [d['close'], round(d['change'] or 0, 2), d['volume'] or 0, d['open'], d['high'], d['low']]
          if len(q) > 500:
              vn = datetime.datetime.utcnow() + datetime.timedelta(hours=7)
              json.dump({'updated': vn.strftime('%Y-%m-%d %H:%M:%S'), 'q': q}, open('live.json', 'w'), separators=(',', ':'))
              print('live', len(q))
          PY
            if curl -fsS --retry 2 --retry-delay 2 --max-time 20 \
                "https://marketstream.fpts.com.vn/mdds/quote?Exchange=MDDS&TypeMsg=M1" -o quote.tmp \
              && python3 - <<'PY'
          import json, sys
          d = json.load(open('quote.tmp', encoding='utf-8'))
          codes = {x.get('Itc') for x in d.get('Data', [])}
          need = {'001_STO', '101_STO', '002_STX'}
          sys.exit(0 if d.get('Code') == 0 and need <= codes else 1)
          PY
            then
              mv quote.tmp quote.json
            else
              echo "Lấy chỉ số FPTS lỗi hoặc thiếu chỉ số, giữ số cũ"
            fi
            # Ghi nhận bất kỳ thay đổi nào (chỉ số và/hoặc giá cổ phiếu), không để cái này chặn cái kia
            [ -f quote.json ] && git add quote.json
            [ -f live.json ] && git add live.json
            if [ -n "$(git status --porcelain)" ]; then
              if git rev-parse -q --verify HEAD >/dev/null; then
                git commit -q --amend -m "Số liệu thị trường $(date -u +%H:%M:%S)"
              else
                git commit -q -m "Số liệu thị trường"
              fi
              git push -q -f origin HEAD:data || echo "Đẩy dữ liệu lỗi, thử lại ở vòng sau"
              echo "Đã cập nhật $(date -u +%H:%M:%S) UTC"
            fi
            NOW=$(date +%s)
            HHMM=$(date -u +%H%M)
            # Dừng sau 14 phút, hoặc khi hết giờ giao dịch (sau 15:12 giờ Việt Nam)
            if [ $((NOW-START)) -ge 840 ] || [ "$HHMM" -ge 0812 ] || [ "$HHMM" -lt 0155 ]; then
              break
            fi
            sleep 60
          done
