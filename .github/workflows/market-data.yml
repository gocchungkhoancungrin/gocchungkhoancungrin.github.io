name: Cập nhật số liệu thị trường

on:
  schedule:
    # Cứ 15 phút khởi động một lần trong giờ giao dịch (09:00 đến 15:55 giờ Việt Nam), thứ Hai đến thứ Sáu
    - cron: '*/15 2-8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Lấy số liệu từ FPTS mỗi phút và ghi vào nhánh data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          mkdir -p work && cd work
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          START=$(date +%s)
          FIRST=1
          while true; do
            if curl -fsS --retry 2 --retry-delay 2 --max-time 20 \
                "https://marketstream.fpts.com.vn/mdds/quote?Exchange=MDDS&TypeMsg=M1" -o quote.tmp \
              && python3 - <<'PY'
          import json, sys
          d = json.load(open('quote.tmp', encoding='utf-8'))
          codes = {x.get('Itc') for x in d.get('Data', [])}
          need = {'001_STO', '101_STO', '002_STX'}
          sys.exit(0 if d.get('Code') == 0 and need <= codes else 1)
          PY
            then
              mv quote.tmp quote.json
              git add quote.json
              if [ "$FIRST" = 1 ]; then
                git commit -q -m "Số liệu thị trường"
                FIRST=0
              else
                git commit -q --amend -m "Số liệu thị trường $(date -u +%H:%M:%S)"
              fi
              git push -q -f origin HEAD:data || echo "Đẩy dữ liệu lỗi, thử lại ở vòng sau"
              echo "Đã cập nhật $(date -u +%H:%M:%S) UTC"
            else
              echo "Lấy dữ liệu lỗi hoặc thiếu chỉ số, bỏ qua vòng này"
            fi
            NOW=$(date +%s)
            HHMM=$(date -u +%H%M)
            # Dừng sau 14 phút, hoặc khi hết giờ giao dịch (sau 15:05 giờ Việt Nam)
            if [ $((NOW-START)) -ge 840 ] || [ "$HHMM" -ge 0805 ] || [ "$HHMM" -lt 0155 ]; then
              break
            fi
            sleep 60
          done
