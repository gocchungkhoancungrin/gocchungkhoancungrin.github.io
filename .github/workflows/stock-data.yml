name: Cập nhật dữ liệu cổ phiếu

on:
  schedule:
    - cron: '*/15 2-8 * * 1-5'
    - cron: '35 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Lấy dữ liệu và ghi vào nhánh stocks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          SCRIPT="$PWD/scripts/fetch_stocks.py"
          mkdir -p ../work && cd ../work
          git init -q -b stocks
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin stocks && git reset -q --soft FETCH_HEAD || true
          python3 "$SCRIPT"
          git add -A
          git commit -q -m "Dữ liệu cổ phiếu $(date -u +%H:%M) UTC" || true
          git push -q -f origin HEAD:stocks
