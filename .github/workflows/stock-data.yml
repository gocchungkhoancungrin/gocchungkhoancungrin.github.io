name: Cập nhật dữ liệu cổ phiếu

on:
  schedule:
    # Mỗi ngày sau phiên (16:35 giờ Việt Nam), thêm một lần dự phòng lúc 18:35
    - cron: '35 9 * * 1-5'
    - cron: '35 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Lấy dữ liệu và ghi vào nhánh stocks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          SCRIPT="$PWD/scripts/fetch_stocks.py"
          mkdir -p ../work && cd ../work
          git init -q -b stocks
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin stocks && git checkout -q -f -B stocks FETCH_HEAD || true
          export HIST=1
          python3 "$SCRIPT"
          git add -A
          MSG="Dữ liệu cổ phiếu $(date -u +%H:%M) UTC"
          if git rev-parse -q --verify HEAD >/dev/null; then git commit -q --amend --allow-empty -m "$MSG"; else git commit -q -m "$MSG"; fi
          git push -q -f origin HEAD:stocks
