name: Probe nguồn dữ liệu
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Thử TradingView scanner và lịch sử giá
        run: |
          echo "=== scanner"
          curl -sS -m 30 -A "Mozilla/5.0" -H "Content-Type: application/json" -X POST "https://scanner.tradingview.com/vietnam/scan" -d '{"symbols":{"tickers":["HOSE:FPT","HOSE:VCB","HOSE:HPG"]},"columns":["name","description","close","change","volume","market_cap_basic","price_earnings_ttm","price_book_fq","earnings_per_share_basic_ttm","book_value_per_share_fq","price_52_week_high","price_52_week_low","return_on_equity_fq","sector","industry","exchange","currency","update_mode","type"]}' | head -c 1800; echo
          echo "=== history"
          curl -sS -m 30 -A "Mozilla/5.0" "https://api-finfo.vndirect.com.vn/v4/stock_prices?q=code:FPT~date:gte:2026-01-01&sort=date&size=400" -o h.json -w "HTTP %{http_code} %{size_download} bytes\n"
          python3 -c "
          import json;d=json.load(open('h.json'));r=d['data'];print(len(r),d.get('totalElements'));print(r[0]);print(r[-1])"
