name: Probe nguồn dữ liệu
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cột TradingView
        run: |
          for c in return_on_assets_fq net_margin_ttm gross_margin_ttm operating_margin_ttm debt_to_equity_fq current_ratio_fq dividend_yield_recent total_revenue_yoy_growth_ttm earnings_per_share_diluted_yoy_growth_ttm price_earnings_growth_ttm enterprise_value_ebitda_ttm; do
            printf "%s => " $c
            curl -sS -m 30 -A "Mozilla/5.0" -H "Content-Type: application/json" -X POST "https://scanner.tradingview.com/vietnam/scan" -d "{\"symbols\":{\"tickers\":[\"HOSE:FPT\"]},\"columns\":[\"$c\"]}" | head -c 200; echo
          done
      - name: Tải thư viện biểu đồ
        run: |
          mkdir -p assets
          curl -fsSL -m 60 -o assets/lightweight-charts.js https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js
          ls -la assets/lightweight-charts.js
          head -c 160 assets/lightweight-charts.js; echo
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/lightweight-charts.js && git commit -m "Thêm thư viện biểu đồ lightweight-charts 4.1.3 (Apache-2.0, TradingView)" && git pull -q --rebase origin main && git push -q origin HEAD:main
